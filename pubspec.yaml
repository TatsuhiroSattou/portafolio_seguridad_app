name: bugtatsu_sec
description: "BugTatsu Sec: portafolio móvil de ciberseguridad con servicios nativos (red, cámara y notificaciones)."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1220"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#0B1220"
    image: assets/branding/splash_logo.png
